name: Connected Check

on:
  push:
    branches:
      - "*"

  pull_request:
    branches:
      - master

jobs:
  # Fast feedback job. Compiles both modules and runs the JVM-only checks on a
  # cheap Ubuntu runner, so compile errors and failing unit tests surface in a
  # couple of minutes instead of after a full emulator cycle. The emulator job
  # below only starts once this passes.
  build:
    # put [skip ci] into the commit message if you don't want to run this workflow

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up build properties
        run: |
          # Raw value, NOT pre-quoted: sample/build.gradle wraps this in quotes
          # itself when generating the BuildConfig field. Writing `licenceKey=""`
          # here produced `""""` in BuildConfig.java, which javac rejects as a
          # malformed text block.
          echo 'licenceKey=' > local.properties

      - name: Assemble and run JVM checks
        run: ./gradlew assembleDebug :library:test :library:checkstyle

  run-connected-checks:
    # Instrumented tests on a real emulator. Only worth spending emulator time
    # on a tree that already compiles, hence `needs: build`.
    needs: build

    # x86_64 host, so the x86_64 system image runs without translation, and
    # KVM is available for real hardware acceleration (see the Enable KVM step).
    #
    # This job previously ran on macos-15-intel. That runner has only 4 logical
    # cores and the emulator caps itself at 1 virtual CPU below 6, which pushed
    # boot to 436s on a run that passed and past the 600s timeout on one that
    # did not. Neither is a workable margin.
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Without this the emulator falls back to software emulation and boots
      # an order of magnitude slower. /dev/kvm exists on the runner but is not
      # world-accessible by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up build properties
        run: |
          echo 'licenceKey=' > local.properties

      - name: Run connectedCheck
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          # `sys.boot_completed` is the only readiness signal the action waits
          # for, and it flips before system_server has published all of its
          # binder services. On a slow boot the package manager was still
          # missing when Gradle tried to install the test APK, failing with
          # `cmd: Can't find service: package` after running 0 tests. Gate on
          # the package manager itself before handing over to Gradle. On an
          # accelerated emulator this exits on the first iteration.
          script: |
            adb wait-for-device
            ready=0
            for i in $(seq 1 60); do
              if adb shell pm path android >/dev/null 2>&1; then
                ready=1
                echo "Package manager ready after $((i * 5))s."
                break
              fi
              sleep 5
            done
            if [ "$ready" != 1 ]; then
              echo "Package manager did not come up within 300s." >&2
              adb shell service list >&2 || true
              exit 1
            fi
            ./gradlew connectedCheck
